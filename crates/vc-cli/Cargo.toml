[package]
name = "vc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI-based RVC voice conversion prototype in Rust"

[lints]
workspace = true

[[bin]]
name = "vc-rs"
path = "src/main.rs"

[features]
# Windows-first default: Windows ML needs no NVIDIA SDK. Keep this aligned with
# vc-app/vc-gui; TensorRT packages use --no-default-features --features
# tensorrt,rnnoise,gtcrn. Revisit the default when Linux support is introduced.
default = ["windowsml", "rnnoise", "gtcrn"]
windowsml = ["vc-core/windowsml", "vc-app/windowsml"]
tensorrt = ["vc-core/tensorrt", "vc-app/tensorrt"]
cuda = ["vc-core/cuda", "vc-app/cuda"]
rnnoise = ["vc-core/rnnoise", "vc-app/rnnoise"]
gtcrn = ["vc-core/gtcrn", "vc-app/gtcrn"]
# Static ORT CPU only: a self-contained, deterministic `vc-rs.exe` for the A/B
# audio comparison workflow (see scripts/compare-audio.ps1). Build with
# `--no-default-features --features cpu`.
cpu = ["vc-core/ort", "vc-app/cpu"]
# Opt-in ASIO host (cpal). Requires the Steinberg ASIO SDK + LLVM at build time;
# see scripts/README.md. Never in `default`.
asio = ["vc-app/asio"]
# Opt-in JACK host (cpal). Reserved for future Linux/macOS builds; links libjack.
jack = ["vc-app/jack"]

[dependencies]
# `clap` is always on (the CLI derives `value_enum` from vc-core's `Provider`);
# the inference backends are selected through this crate's features above.
vc-core = { path = "../vc-core", features = ["clap"] }
vc-app = { path = "../vc-app", default-features = false }
anyhow.workspace = true
tracing.workspace = true
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.2"
ctrlc = "3.4"
hound = "3.5"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
approx = "0.5"
