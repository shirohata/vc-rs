[package]
name = "vc-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone GUI for vc-rs"

[lints]
workspace = true

[features]
ui-snapshots = ["egui_kittest/snapshot", "dep:egui-wgpu", "dep:wgpu", "dep:image", "dep:pollster"]
# Match the Windows-first CLI/runtime default without requiring an NVIDIA SDK.
default = ["windowsml", "rnnoise", "gtcrn"]
windowsml = ["vc-app/windowsml", "vc-core/windowsml"]
tensorrt = ["vc-app/tensorrt", "vc-core/tensorrt"]
cuda = ["vc-app/cuda", "vc-core/cuda"]
rnnoise = ["vc-app/rnnoise", "vc-core/rnnoise"]
gtcrn = ["vc-app/gtcrn", "vc-core/gtcrn"]
# Opt-in ASIO host (cpal). Requires the Steinberg ASIO SDK + LLVM at build time;
# see scripts/README.md. Never in `default`.
asio = ["vc-app/asio"]
# Opt-in JACK host (cpal). Reserved for future Linux/macOS builds; links libjack.
jack = ["vc-app/jack"]

[dependencies]
# Opt-in test renderer; Vulkan avoids upstream kittest's incompatible DX12
# allocator bindings. These are absent from the shipped GUI feature sets.
egui-wgpu = { version = "0.34.3", default-features = false, optional = true }
wgpu = { version = "29.0.3", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
pollster = { version = "0.4", optional = true }
vc-app = { path = "../vc-app", default-features = false }
vc-core = { path = "../vc-core" }
# Offline .pth → .onnx converter behind the RVC model picker. ORT-free and
# featureless, so it adds nothing to the inference feature matrix.
vc-convert = { path = "../vc-convert" }
eframe = { version = "0.34.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.34.1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
egui_kittest = "0.34.3"
