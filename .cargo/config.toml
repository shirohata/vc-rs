[alias]
# `cargo xtask bundle vc-vst3 --release` builds the plugin and wraps the cdylib
# into a .vst3 bundle under target/bundled/.
xtask = "run --package xtask --release --"

[env]
# ort rc.13 ships CUDA 13 binaries only. Match scripts/activate.ps1 and the
# repository's CUDA 13 / TensorRT 11 line even without shell activation.
ORT_CUDA_VERSION = "13"
